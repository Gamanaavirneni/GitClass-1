<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webpage Layout</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        /* Header */
        header {
            height: 100px;
            background-color: red;
            color: white;
            text-align: center;
            padding: 20px;
        }

        header h1 {
            margin-bottom: 15px;
        }

        .menu {
            display: flex;
            justify-content: center;
            gap: 60px;
        }

        /* Small Boxes */
        .small-boxes {
            display: flex;
        }

        .small-box {
            background-color: rgb(56, 232, 255);
            height: 100px;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* Main Container */
        .container {
            display: flex;
            height: 400px;
        }

        /* Sidebar */
        .sidebar {
            background-color: rgb(40, 255, 40);
            color: white;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            font-weight: bold;
        }

        /* Main Content */
        .main-content {
            background-color: rgb(202, 218, 33);
            flex: 3;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            font-weight: bold;
        }

        /* Footer */
        footer {
            height: 80px;
            background-color: rgba(0, 0, 255, 0.731);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <header>
        <h1>HEADER</h1>

        <nav class="menu">
            <span>Home</span>
            <span>About</span>
            <span>Login</span>
        </nav>
    </header>

    <!-- Small Boxes -->
    <div class="small-boxes">
        <div class="small-box">SMALL BOX 1</div>
        <div class="small-box">SMALL BOX 2</div>
        <div class="small-box">SMALL BOX 3</div>
    </div>

    <!-- Main Content and Sidebar -->
    <div class="container">

        <main class="main-content">
            MAIN BOX
        </main>

        <aside class="sidebar">
            SIDE BOX
        </aside>

    </div>

    <footer>
        FOOTER
    </footer>

</body>

</html>
